name: Deploy

# Deploys the AWS stacks (Stage 09). Manual only, and not run in this project: CI checks the
# stacks without deploying (README, AWS). The order matters:
#   1. the infra stack: the image repositories and CloudFront's address;
#   2. the five images, tagged with the commit, the frontend built for that address;
#   3. the services stack, at the commit's images.
# Before the first services deploy, put the keys into Secrets Manager (README, AWS).
#
# Repository secret: AWS_DEPLOY_ROLE_ARN (an OIDC role). Repository variables: AWS_REGION,
# COGNITO_USER_POOL_ID, COGNITO_CLIENT_ID, QDRANT_URL, LANGFUSE_BASE_URL and, for a custom
# domain, ALLOWED_ORIGINS.

on:
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

permissions:
    id-token: write
    contents: read

env:
    AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    # A missing input is an error here, not a placeholder (lib/config.ts).
    CDK_REQUIRE_DEPLOY_CONFIG: 'true'
    COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
    COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
    QDRANT_URL: ${{ vars.QDRANT_URL }}
    LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
    ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}

jobs:
    infra:
        name: Infra stack
        runs-on: ubuntu-latest
        outputs:
            public-url: ${{ steps.outputs.outputs.public-url }}
        defaults:
            run:
                working-directory: infrastructure/cdk
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: infrastructure/cdk/package-lock.json

            - run: npm ci

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Deploy
              run: >-
                  npx cdk deploy DocumentsInfraStack --require-approval never
                  -c imageTag=${{ github.sha }} --outputs-file outputs.json

            - id: outputs
              run: echo "public-url=$(jq -r '.DocumentsInfraStack.PublicUrl' outputs.json)" >> "$GITHUB_OUTPUT"

    images:
        name: Image (${{ matrix.image }})
        needs: infra
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: true
            matrix:
                # Arm on Fargate, built on Arm runners; LiteLLM publishes amd64 only.
                include:
                    - { image: api, file: docker/Dockerfile.api, target: production, platform: linux/arm64, runner: ubuntu-24.04-arm }
                    - { image: frontend, file: docker/Dockerfile.frontend, target: production, platform: linux/arm64, runner: ubuntu-24.04-arm }
                    - { image: ai-service, file: docker/Dockerfile.ai, target: serve, platform: linux/arm64, runner: ubuntu-24.04-arm }
                    - { image: ingestion-worker, file: docker/Dockerfile.ai, target: ingest, platform: linux/arm64, runner: ubuntu-24.04-arm }
                    - { image: llm-gateway, file: docker/Dockerfile.gateway, target: production, platform: linux/amd64, runner: ubuntu-latest }
        steps:
            - uses: actions/checkout@v5

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - id: ecr
              uses: aws-actions/amazon-ecr-login@v2

            - uses: docker/setup-buildx-action@v3

            # Tags are immutable in ECR: each commit's images are pushed once.
            - uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  platforms: ${{ matrix.platform }}
                  push: true
                  tags: ${{ steps.ecr.outputs.registry }}/documents/${{ matrix.image }}:${{ github.sha }}
                  # Next.js writes these into the browser bundle (docker/Dockerfile.frontend).
                  build-args: |
                      NEXT_PUBLIC_API_URL=${{ needs.infra.outputs.public-url }}
                      NEXT_PUBLIC_WS_URL=${{ needs.infra.outputs.public-url }}
                  cache-from: type=gha,scope=deploy-${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=deploy-${{ matrix.image }}

    services:
        name: Services stack
        needs: [infra, images]
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: infrastructure/cdk
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: infrastructure/cdk/package-lock.json

            - run: npm ci

            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Deploy
              run: >-
                  npx cdk deploy DocumentsServicesStack --require-approval never
                  -c imageTag=${{ github.sha }}
