name: CI

on:
    push:
        branches: ['**']
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-shared:
        name: Build shared
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build shared
              run: npm run build -w @documents/shared

            - name: Upload shared dist
              uses: actions/upload-artifact@v4
              with:
                  name: shared-dist
                  path: packages/shared/dist
                  retention-days: 1

    # The AWS stacks (Stage 09), checked without deploying and without AWS credentials:
    # they are environment-agnostic, and deploy-time inputs have placeholders here.
    cdk:
        name: CDK (tests, cdk-nag, synth)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: infrastructure/cdk
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: infrastructure/cdk/package-lock.json

            - name: Install CDK dependencies
              run: npm ci

            - name: Type-check
              run: npm run check

            # Assertion tests, with cdk-nag's AWS Solutions checks.
            - name: Test
              run: npm test

            # cdk-nag and CloudFormation's rules run again here and fail the synth.
            - name: Synthesize
              run: npx cdk synth --quiet

            - name: No account ID or secret in the templates
              run: |
                  if grep -En '(^|[^0-9A-Za-z])[0-9]{12}([^0-9A-Za-z]|$)|AIza[0-9A-Za-z_-]{20}|sk-lf-|pk-lf-' cdk.out/*.template.json; then
                      exit 1
                  fi

    lint:
        name: Lint (${{ matrix.service }})
        needs: build-shared
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [api, frontend]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Download shared dist
              uses: actions/download-artifact@v4
              with:
                  name: shared-dist
                  path: packages/shared/dist

            - name: Lint ${{ matrix.service }}
              run: npm run lint -w @documents/${{ matrix.service }}

    build:
        name: Build (${{ matrix.service }})
        needs: build-shared
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [api]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Download shared dist
              uses: actions/download-artifact@v4
              with:
                  name: shared-dist
                  path: packages/shared/dist

            - name: Build ${{ matrix.service }}
              run: npm run build -w @documents/${{ matrix.service }}
              env:
                  NODE_ENV: production

    test:
        name: Tests (${{ matrix.service }})
        needs: build
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                service: [api]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Download shared dist
              uses: actions/download-artifact@v4
              with:
                  name: shared-dist
                  path: packages/shared/dist

            - name: Run tests
              run: npm test -w @documents/${{ matrix.service }}
              env:
                  NODE_ENV: test
                  CI: 'true'

    # Runs without Gemini or Langfuse keys: tracing is off and integration tests are skipped.
    # The OCR models (37 MB) and Docling's models (about 370 MB) are cached between runs.
    python:
        name: Python (ai)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: services/ai
        # For the tests marked qdrant: tenant isolation and alias switching on a real server.
        services:
            qdrant:
                image: qdrant/qdrant:v1.19.2
                ports:
                    - 6333:6333
        steps:
            - uses: actions/checkout@v5

            - uses: astral-sh/setup-uv@v10.3.0
              with:
                  version: '0.12.17'
                  enable-cache: true
                  cache-dependency-glob: services/ai/uv.lock

            - name: Install dependencies
              run: uv sync --locked --all-extras

            - name: Cache OCR and Docling models
              uses: actions/cache@v4
              with:
                  path: |
                      services/ai/.cache/tessdata
                      ~/.cache/huggingface
                  key: models-${{ hashFiles('services/ai/src/docai/ingest/setup.py', 'services/ai/uv.lock') }}

            - name: Lint
              run: |
                  uv run ruff check
                  uv run ruff format --check

            - name: Type-check
              run: uv run mypy

            - name: Test
              run: uv run pytest
              env:
                  QDRANT_TEST_URL: http://localhost:6333

    docker-build:
        name: Docker Build (${{ matrix.service }})
        needs: [test, lint, python]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { service: api, file: docker/Dockerfile.api, target: production }
                    - { service: frontend, file: docker/Dockerfile.frontend, target: production }
                    - { service: ai, file: docker/Dockerfile.ai, target: serve }
                    - { service: ingest, file: docker/Dockerfile.ai, target: ingest }
                    - { service: gateway, file: docker/Dockerfile.gateway, target: production }
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-buildx-action@v3

            - name: Build ${{ matrix.service }} image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  push: false
                  cache-from: type=gha,scope=${{ matrix.service }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.service }}
